<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>العجمي | Alajamy - خريطة الماركتات</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Marker Cluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  
  <!-- Google Fonts - Arabic friendly -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #0d7377;
      --primary-dark: #0a5c5f;
      --accent: #14919b;
      --bg: #f4f7f7;
      --card-bg: #ffffff;
      --text: #1a1a1a;
      --text-muted: #5a6a6a;
      --border: #e0e8e8;
      --success: #10b981;
      --shadow: 0 4px 20px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, #0d7377 0%, #14919b 100%);
      color: white;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
      z-index: 1000;
      flex-shrink: 0;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-area img {
      height: 56px;
      width: auto;
      background: white;
      border-radius: 12px;
      padding: 4px 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .header-title h1 {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .header-title p {
      font-size: 0.85rem;
      opacity: 0.9;
      font-weight: 400;
    }

    .stats {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .stat-box {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 12px;
      text-align: center;
      min-width: 90px;
    }

    .stat-box .number {
      font-size: 1.5rem;
      font-weight: 800;
      display: block;
    }

    .stat-box .label {
      font-size: 0.75rem;
      opacity: 0.9;
    }

    .refresh-info {
      font-size: 0.8rem;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .refresh-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Main layout */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar */
    .sidebar {
      width: 360px;
      background: var(--card-bg);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 500;
      box-shadow: -4px 0 20px rgba(0,0,0,0.06);
    }

    .sidebar-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: #fafcfc;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      direction: rtl;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(20,145,155,0.15);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.5;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .location-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .location-card:hover {
      border-color: var(--accent);
      box-shadow: 0 4px 16px rgba(13,115,119,0.12);
      transform: translateY(-1px);
    }

    .location-card.active {
      border-color: var(--primary);
      background: linear-gradient(135deg, #f0fafa 0%, #e6f5f5 100%);
      box-shadow: 0 4px 16px rgba(13,115,119,0.15);
    }

    .location-card .market-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .location-card .market-name .badge {
      background: var(--primary);
      color: white;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    .location-card .meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .location-card .meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .location-card .phone {
      color: var(--primary);
      font-weight: 600;
      direction: ltr;
      unicode-bidi: embed;
    }

    /* Map */
    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }

    /* Custom popup */
    .leaflet-popup-content-wrapper {
      border-radius: 16px !important;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15) !important;
      padding: 0 !important;
      overflow: hidden;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      width: 280px !important;
    }

    .leaflet-popup-tip {
      box-shadow: none !important;
    }

    .popup-card {
      font-family: 'Cairo', sans-serif;
      direction: rtl;
    }

    .popup-header {
      background: linear-gradient(135deg, #0d7377 0%, #14919b 100%);
      color: white;
      padding: 14px 16px;
    }

    .popup-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .popup-header .date {
      font-size: 0.8rem;
      opacity: 0.9;
    }

    .popup-body {
      padding: 14px 16px;
      background: white;
    }

    .popup-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.9rem;
    }

    .popup-row:last-child {
      border-bottom: none;
    }

    .popup-row .label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .popup-row .value {
      font-weight: 600;
      color: var(--text);
      text-align: left;
      direction: ltr;
    }

    .popup-actions {
      padding: 12px 16px;
      background: #f8fafa;
      display: flex;
      gap: 8px;
    }

    .popup-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: all 0.2s;
    }

    .popup-btn.primary {
      background: var(--primary);
      color: white;
    }

    .popup-btn.primary:hover {
      background: var(--primary-dark);
    }

    .popup-btn.secondary {
      background: white;
      color: var(--primary);
      border: 1px solid var(--border);
    }

    /* Loading & empty */
    .loading, .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 45%;
        border-left: none;
        border-top: 1px solid var(--border);
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      }

      .stats {
        display: none;
      }

      header {
        padding: 10px 16px;
      }

      .logo-area img {
        height: 44px;
      }

      .header-title h1 {
        font-size: 1.1rem;
      }
    }

    /* Custom Alajamy Pin Marker */
    .alajamy-marker {
      background: transparent;
      border: none;
    }

    .alajamy-marker .pin {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #0d7377 0%, #14919b 100%);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 3px solid #ffffff;
      box-shadow: 0 3px 10px rgba(13, 115, 119, 0.45);
      position: relative;
    }

    .alajamy-marker .pin-inner {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Cluster styling */
    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background-color: rgba(13, 115, 119, 0.25) !important;
    }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background-color: #0d7377 !important;
      color: white !important;
      font-family: 'Cairo', sans-serif !important;
      font-weight: 700 !important;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-area">
      <img src="logo.png" alt="العجمي Alajamy" />
      <div class="header-title">
        <h1>العجمي · Alajamy</h1>
        <p>خريطة الماركتات والتوزيع · Since 1989</p>
      </div>
    </div>
    <div class="stats">
      <div class="stat-box">
        <span class="number" id="totalCount">0</span>
        <span class="label">ماركت</span>
      </div>
      <div class="stat-box">
        <span class="number" id="todayCount">0</span>
        <span class="label">اليوم</span>
      </div>
      <div class="refresh-info">
        <span class="refresh-dot"></span>
        <span id="lastUpdate">جاري التحميل...</span>
      </div>
    </div>
  </header>

  <div class="main">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>قائمة الماركتات</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="ابحث باسم الماركت أو الموزع..." />
        </div>
      </div>
      <div class="list-container" id="listContainer">
        <div class="loading">
          <div class="spinner"></div>
          <p>جاري تحميل البيانات...</p>
        </div>
      </div>
    </aside>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  
  <script>
    // ============== CONFIG ==============
    // استخدم رابط الـ CSV المباشر من جوجل شيت (يجب أن يكون الشيت منشور للعامة)
    const SHEET_ID = "1WSZICC3xS160g3MVaj8MgUHDcjcckQxzEMIbzgluZ8I";
    const REFRESH_INTERVAL = 45000; // 45 seconds

    function getSheetUrl() {
      // طريقة موثوقة نسبياً لجلب البيانات
      return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&t=${Date.now()}`;
    }

    // ============== STATE ==============
    let map;
    let markersLayer;
    let allLocations = [];
    let markersById = {};

    // ============== INIT MAP ==============
    function initMap() {
      map = L.map('map', {
        center: [36.83, 34.68], // Approximate center of current data (Mersin area)
        zoom: 12,
        zoomControl: false
      });

      L.control.zoom({ position: 'bottomleft' }).addTo(map);

      // Esri World Street Map - مجاني وموثوق 100% ولا يحتاج أي API Key
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19
      }).addTo(map);

      // مجموعة عنقودية للمؤشرات (تبدو أجمل لما يكون في نقاط كثيرة)
      markersLayer = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 50,
        spiderfyOnMaxZoom: true,
        disableClusteringAtZoom: 17
      }).addTo(map);
    }

    // ============== PARSE CSV ==============
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];

      const headers = parseCSVLine(lines[0]);
      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const values = parseCSVLine(lines[i]);
        if (values.length < 6) continue;

        const row = {};
        headers.forEach((h, idx) => {
          row[h] = values[idx] || '';
        });

        // Clean and extract
        const lat = parseFloat(row['الاحداثيات الطول'] || row[headers[4]]);
        const lng = parseFloat(row['الاحداثيات العرض'] || row[headers[5]]);

        if (isNaN(lat) || isNaN(lng)) continue;

        rows.push({
          id: i,
          date: row['التاريخ'] || '',
          distributor: row['اسم الموزع'] || '',
          market: row['اسم الماركت'] || 'غير محدد',
          phone: row['رقم هاتف الماركت'] || '',
          lat: lat,
          lng: lng,
          qty: row['---'] || row[headers[6]] || '',
          mapsLink: (row['رابط الموقع'] || '').replace(/^"|"$/g, '')
        });
      }
      return rows;
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    // ============== RENDER ==============
    function createPopupContent(loc) {
      const phoneDisplay = loc.phone && loc.phone !== '0' ? loc.phone : '—';
      const mapsUrl = loc.mapsLink || `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;

      return `
        <div class="popup-card">
          <div class="popup-header">
            <h3>${escapeHtml(loc.market)}</h3>
            <div class="date">${escapeHtml(loc.date)}</div>
          </div>
          <div class="popup-body">
            <div class="popup-row">
              <span class="label">الموزع</span>
              <span class="value">${escapeHtml(loc.distributor || '—')}</span>
            </div>
            <div class="popup-row">
              <span class="label">الهاتف</span>
              <span class="value" style="direction:ltr">${escapeHtml(phoneDisplay)}</span>
            </div>
            <div class="popup-row">
              <span class="label">دقة الموقع بالمتر</span>
              <span class="value">${escapeHtml(loc.qty || '—')}</span>
            </div>
            <div class="popup-row">
              <span class="label">الإحداثيات</span>
              <span class="value" style="font-size:0.8rem">${loc.lat.toFixed(5)}, ${loc.lng.toFixed(5)}</span>
            </div>
          </div>
          <div class="popup-actions">
            <a href="${mapsUrl}" target="_blank" class="popup-btn primary">فتح في خرائط جوجل</a>
            ${phoneDisplay !== '—' ? `<a href="tel:${phoneDisplay}" class="popup-btn secondary">اتصال</a>` : ''}
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderMarkers(locations) {
      markersLayer.clearLayers();
      markersById = {};

      // أيقونة مخصصة جميلة بلون الشركة
      const alajamyIcon = L.divIcon({
        className: 'alajamy-marker',
        html: `<div class="pin">
                 <div class="pin-inner"></div>
               </div>`,
        iconSize: [32, 42],
        iconAnchor: [16, 42],
        popupAnchor: [0, -36]
      });

      locations.forEach(loc => {
        const marker = L.marker([loc.lat, loc.lng], {
          title: loc.market,
          icon: alajamyIcon
        });

        marker.bindPopup(createPopupContent(loc), {
          maxWidth: 300,
          className: 'custom-popup'
        });

        marker.on('click', () => {
          highlightCard(loc.id);
        });

        markersLayer.addLayer(marker);
        markersById[loc.id] = marker;
      });

      if (locations.length > 0) {
        map.fitBounds(markersLayer.getBounds().pad(0.12));
      }
    }

    function renderList(locations) {
      const container = document.getElementById('listContainer');
      
      if (locations.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p style="font-size:2rem;margin-bottom:8px">📍</p>
            <p>لا توجد بيانات حالياً</p>
          </div>
        `;
        return;
      }

      // Sort by date descending (newest first)
      const sorted = [...locations].sort((a, b) => {
        return b.date.localeCompare(a.date);
      });

      container.innerHTML = sorted.map(loc => {
        const phone = loc.phone && loc.phone !== '0' ? loc.phone : null;
        return `
          <div class="location-card" data-id="${loc.id}" onclick="focusLocation(${loc.id})">
            <div class="market-name">
              ${escapeHtml(loc.market)}
              ${loc.qty ? `<span class="badge">${escapeHtml(loc.qty)}</span>` : ''}
            </div>
            <div class="meta">
              <span>👤 ${escapeHtml(loc.distributor || '—')}</span>
              ${phone ? `<span class="phone">📞 ${escapeHtml(phone)}</span>` : ''}
              <span>🕒 ${escapeHtml(loc.date.split(' ')[0] || loc.date)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStats(locations) {
      document.getElementById('totalCount').textContent = locations.length;

      const today = new Date();
      const todayStr = `${String(today.getDate()).padStart(2,'0')}/${String(today.getMonth()+1).padStart(2,'0')}/${today.getFullYear()}`;
      
      // Also try other formats
      const todayCount = locations.filter(l => {
        return l.date.includes(todayStr) || 
               l.date.includes(today.toISOString().slice(0,10)) ||
               l.date.startsWith(String(today.getDate()).padStart(2,'0') + '/' + String(today.getMonth()+1).padStart(2,'0'));
      }).length;

      document.getElementById('todayCount').textContent = todayCount;

      const now = new Date();
      document.getElementById('lastUpdate').textContent = 
        `آخر تحديث: ${now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}`;
    }

    function focusLocation(id) {
      const marker = markersById[id];
      if (marker) {
        map.setView(marker.getLatLng(), 16);
        marker.openPopup();
        highlightCard(id);
      }
    }

    function highlightCard(id) {
      document.querySelectorAll('.location-card').forEach(el => {
        el.classList.toggle('active', el.dataset.id == id);
      });
      const card = document.querySelector(`.location-card[data-id="${id}"]`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    // ============== SEARCH ==============
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        renderList(allLocations);
        return;
      }
      const filtered = allLocations.filter(loc => 
        (loc.market && loc.market.toLowerCase().includes(q)) ||
        (loc.distributor && loc.distributor.toLowerCase().includes(q)) ||
        (loc.phone && loc.phone.includes(q))
      );
      renderList(filtered);
    });

    // ============== DATA FETCH ==============
    async function loadData() {
      try {
        const url = getSheetUrl();
        const res = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          cache: 'no-store'
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const text = await res.text();

        // تحقق سريع أن الرد فعلاً CSV مش صفحة خطأ
        if (!text.includes('التاريخ') && !text.includes(',')) {
          throw new Error('Invalid CSV response');
        }

        const locations = parseCSV(text);
        
        allLocations = locations;
        renderMarkers(locations);
        renderList(locations);
        updateStats(locations);

      } catch (err) {
        console.error('Failed to load data:', err);
        document.getElementById('listContainer').innerHTML = `
          <div class="empty-state">
            <p style="font-size:1.5rem">⚠️</p>
            <p>تعذر تحميل البيانات</p>
            <p style="font-size:0.85rem;margin-top:8px;line-height:1.5">
              تأكد أن الشيت <b>منشور للعامة</b><br>
              (Share → Anyone with the link)
            </p>
          </div>
        `;
        document.getElementById('lastUpdate').textContent = 'فشل التحديث';
      }
    }

    // ============== START ==============
    initMap();
    loadData();
    setInterval(loadData, REFRESH_INTERVAL);

    // Make focusLocation available globally
    window.focusLocation = focusLocation;
