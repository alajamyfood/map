<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>العجمي | Alajamy - خريطة الماركتات</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0d7377;--dark:#0a5c5f;--accent:#14919b;--bg:#f4f7f7;--card:#fff;--text:#1a1a1a;--muted:#5a6a6a;--border:#e0e8e8;--peek:132px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}

header{background:linear-gradient(135deg,#0d7377,#14919b);color:#fff;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.15);z-index:1000;flex-shrink:0}
.logo-area{display:flex;align-items:center;gap:12px;min-width:0}
.logo-area img{height:44px;background:#fff;border-radius:10px;padding:3px 8px}
.header-title h1{font-size:1.25rem;font-weight:800;line-height:1.2}
.header-title p{font-size:.78rem;opacity:.9}
.stats{display:flex;gap:10px;align-items:center}
.stat-box{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:12px;text-align:center;min-width:64px}
.stat-box .number{font-size:1.25rem;font-weight:800;display:block;line-height:1.2}
.stat-box .label{font-size:.7rem;opacity:.9}
.refresh-info{font-size:.75rem;opacity:.85;display:flex;align-items:center;gap:6px}
.refresh-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.4}}

.main{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}
#map{flex:1;height:100%;z-index:1}

.sidebar{width:360px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:500}
.handle{display:none}
.sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border);background:#fafcfc}
.sidebar-header h2{font-size:1.05rem;font-weight:700;color:var(--primary);margin-bottom:8px}
.search-box{position:relative}
.search-box input{width:100%;padding:10px 40px 10px 14px;border:1px solid var(--border);border-radius:12px;font-family:inherit;font-size:16px;outline:none}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(20,145,155,.15)}
.search-box::after{content:"🔍";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.5;pointer-events:none}
.list-container{flex:1;overflow-y:auto;padding:10px;overscroll-behavior:contain}

.location-card{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.location-card:hover{border-color:var(--accent)}
.location-card.active{border-color:var(--primary);background:#eaf6f6}
.market-name{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order-num{background:#e8f4f4;color:var(--primary);font-size:.75rem;font-weight:800;padding:2px 8px;border-radius:8px}
.badge{background:var(--primary);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:20px;font-weight:600;margin-right:auto}
.meta{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
.phone{color:var(--primary);font-weight:600;direction:ltr;unicode-bidi:embed}

/* Detail card: stays until the user closes it */
.detail{position:absolute;z-index:700;bottom:16px;left:16px;width:380px;max-width:calc(100% - 32px);background:#fff;border-radius:18px;box-shadow:0 10px 36px rgba(0,0,0,.22);overflow:hidden;transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none;transition:transform .28s ease,opacity .2s}
.detail.show{transform:none;opacity:1;pointer-events:auto}
.d-head{background:linear-gradient(135deg,#0d7377,#14919b);color:#fff;padding:12px 14px;display:flex;align-items:flex-start;gap:10px}
.d-head div{flex:1;min-width:0}
.d-head h3{font-size:1.1rem;font-weight:700;line-height:1.35}
.d-head small{font-size:.78rem;opacity:.9}
.d-close{border:none;background:rgba(255,255,255,.22);color:#fff;width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer;flex-shrink:0}
.d-body{padding:4px 14px}
.d-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.9rem}
.d-row:last-child{border-bottom:none}
.d-row span:first-child{color:var(--muted)}
.d-row span:last-child{font-weight:600}
.d-actions{padding:10px 14px 14px;display:flex;gap:8px}
.btn{flex:1;padding:11px 10px;border-radius:12px;font-family:inherit;font-size:.9rem;font-weight:700;text-align:center;text-decoration:none;border:1px solid var(--border);background:#fff;color:var(--primary)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}

.empty-state,.loading{text-align:center;padding:36px 16px;color:var(--muted)}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.pin{width:28px;height:28px;background:linear-gradient(135deg,#0d7377,#14919b);border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 3px 10px rgba(13,115,119,.45);position:relative;transition:transform .2s}
.pin::after{content:"";position:absolute;width:10px;height:10px;background:#fff;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%)}
.sel .pin{background:#e8590c;transform:rotate(-45deg) scale(1.3);box-shadow:0 4px 14px rgba(232,89,12,.55)}
.alajamy-marker{background:transparent;border:none}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background-color:rgba(13,115,119,.25)!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background-color:#0d7377!important;color:#fff!important;font-family:'Cairo',sans-serif!important;font-weight:700!important}

@media (max-width:768px){
  header{padding:8px 12px}
  .logo-area img{height:36px}
  .header-title h1{font-size:1rem}
  .header-title p,.refresh-info{display:none}
  .stat-box{min-width:56px;padding:4px 9px}
  .stat-box .number{font-size:1.05rem}

  /* map fills the screen; list is a bottom sheet */
  .sidebar{position:absolute;left:0;right:0;bottom:0;width:100%;height:60%;border:none;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.14);transform:translateY(calc(100% - var(--peek)));transition:transform .3s ease}
  .sidebar.open{transform:none}
  .handle{display:block;width:100%;padding:10px 0 4px;border:none;background:none;cursor:pointer}
  .handle::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:#c5d2d2;margin:0 auto}
  .sidebar-header{padding:0 14px 10px;border:none;background:none}
  .sidebar-header h2{display:none}
  .sidebar.hide{transform:translateY(105%)}

  .detail{left:10px;right:10px;width:auto;max-width:none;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .leaflet-control-zoom{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo-area">
    <img src="logo.png" alt="العجمي Alajamy" />
    <div class="header-title"><h1>العجمي · Alajamy</h1><p>خريطة الماركتات والتوزيع · Since 1989</p></div>
  </div>
  <div class="stats">
    <div class="stat-box"><span class="number" id="totalCount">0</span><span class="label">ماركت</span></div>
    <div class="stat-box"><span class="number" id="todayCount">0</span><span class="label">اليوم</span></div>
    <div class="refresh-info"><span class="refresh-dot"></span><span id="lastUpdate">جاري التحميل...</span></div>
  </div>
</header>

<div class="main">
  <aside class="sidebar" id="sidebar">
    <button class="handle" id="handle" aria-label="فتح أو إغلاق القائمة"></button>
    <div class="sidebar-header">
      <h2>قائمة الماركتات</h2>
      <div class="search-box"><input type="search" id="searchInput" placeholder="ابحث باسم الماركت أو الموزع..." /></div>
    </div>
    <div class="list-container" id="listContainer"><div class="loading"><div class="spinner"></div><p>جاري تحميل البيانات...</p></div></div>
  </aside>

  <div id="map"></div>

  <div class="detail" id="detail" role="dialog" aria-live="polite"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const SHEET_ID = "1WSZICC3xS160g3MVaj8MgUHDcjcckQxzEMIbzgluZ8I";
const REFRESH_INTERVAL = 45000;
const isMobile = () => window.matchMedia('(max-width:768px)').matches;

let map, cluster, allLocations = [], markersById = {}, selectedId = null, lastText = '', firstLoad = true;

const iconNormal = L.divIcon({className:'alajamy-marker',html:'<div class="pin"></div>',iconSize:[32,42],iconAnchor:[16,42]});
const iconSel = L.divIcon({className:'alajamy-marker sel',html:'<div class="pin"></div>',iconSize:[32,42],iconAnchor:[16,42]});

function initMap(){
  map = L.map('map',{center:[36.83,34.68],zoom:12,zoomControl:false});
  if(!isMobile()) L.control.zoom({position:'bottomleft'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles &copy; Esri',maxZoom:19}).addTo(map);
  cluster = L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:50,spiderfyOnMaxZoom:true,disableClusteringAtZoom:17}).addTo(map);
  map.on('click', closeDetail); // tap on empty map closes the card
}

/* ---------- CSV ---------- */
function parseCSVLine(line){
  const out=[];let cur='',q=false;
  for(const ch of line){
    if(ch==='"') q=!q;
    else if(ch===','&&!q){out.push(cur.trim());cur='';}
    else cur+=ch;
  }
  out.push(cur.trim());return out;
}
function dateKey(s){ // DD/MM/YYYY HH:MM:SS -> sortable number
  const m=(s||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\D+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(!m) return 0;
  return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)).getTime();
}
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/);
  if(lines.length<2) return [];
  const headers=parseCSVLine(lines[0]);
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const v=parseCSVLine(lines[i]);
    if(v.length<6) continue;
    const row={};
    headers.forEach((h,idx)=>row[h]=v[idx]||'');
    const lat=parseFloat(row['الاحداثيات الطول']||row[headers[4]]);
    const lng=parseFloat(row['الاحداثيات العرض']||row[headers[5]]);
    if(isNaN(lat)||isNaN(lng)) continue;
    const date=row['التاريخ']||'';
    rows.push({id:i,date,ts:dateKey(date)||i,distributor:row['اسم الموزع']||'',market:row['اسم الماركت']||'غير محدد',
      phone:row['رقم هاتف الماركت']||'',lat,lng,qty:row['---']||row[headers[6]]||'',
      mapsLink:(row['رابط الموقع']||'').replace(/^"|"$/g,'')});
  }
  return rows;
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const validPhone=p=>p&&p!=='0'?p:null;

/* ---------- Render ---------- */
function renderMarkers(locs,fit){
  cluster.clearLayers();markersById={};
  locs.forEach(loc=>{
    const m=L.marker([loc.lat,loc.lng],{title:loc.market,icon:loc.id===selectedId?iconSel:iconNormal});
    m.on('click',e=>{L.DomEvent.stopPropagation(e);selectLocation(loc.id);});
    cluster.addLayer(m);markersById[loc.id]=m;
  });
  if(fit&&locs.length) map.fitBounds(cluster.getBounds().pad(0.12));
}

function renderList(locs){
  const box=document.getElementById('listContainer');
  if(!locs.length){box.innerHTML='<div class="empty-state"><p style="font-size:2rem">📍</p><p>لا توجد نتائج</p></div>';return;}
  const num={};
  [...allLocations].sort((a,b)=>a.ts-b.ts).forEach((l,i)=>num[l.id]=i+1);
  box.innerHTML=[...locs].sort((a,b)=>b.ts-a.ts).map(loc=>{
    const ph=validPhone(loc.phone);
    return `<div class="location-card${loc.id===selectedId?' active':''}" data-id="${loc.id}">
      <div class="market-name"><span class="order-num">#${num[loc.id]}</span>${esc(loc.market)}${loc.qty?`<span class="badge">${esc(loc.qty)}</span>`:''}</div>
      <div class="meta"><span>👤 ${esc(loc.distributor||'—')}</span>${ph?`<span class="phone">📞 ${esc(ph)}</span>`:''}<span>🕒 ${esc(loc.date.split(' ')[0]||loc.date)}</span></div>
    </div>`;
  }).join('');
}

function updateStats(locs){
  document.getElementById('totalCount').textContent=locs.length;
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const today=`${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;
  document.getElementById('todayCount').textContent=locs.filter(l=>l.date.trim().startsWith(today)).length;
  document.getElementById('lastUpdate').textContent='آخر تحديث: '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
}

/* ---------- Selection + detail card ---------- */
function selectLocation(id){
  const loc=allLocations.find(l=>l.id===id);if(!loc) return;
  const prev=markersById[selectedId];if(prev) prev.setIcon(iconNormal);
  selectedId=id;
  const m=markersById[id];if(m) m.setIcon(iconSel);

  const ph=validPhone(loc.phone);
  const url=loc.mapsLink||`https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
  const d=document.getElementById('detail');
  d.innerHTML=`<div class="d-head"><div><h3>${esc(loc.market)}</h3><small>${esc(loc.date)}</small></div>
      <button class="d-close" id="dClose" aria-label="إغلاق">✕</button></div>
    <div class="d-body">
      <div class="d-row"><span>الموزع</span><span>${esc(loc.distributor||'—')}</span></div>
      <div class="d-row"><span>الهاتف</span><span style="direction:ltr">${esc(ph||'—')}</span></div>
      <div class="d-row"><span>دقة الموقع بالمتر</span><span>${esc(loc.qty||'—')}</span></div>
    </div>
    <div class="d-actions"><a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">فتح في خرائط جوجل</a>${ph?`<a class="btn" href="tel:${esc(ph)}">اتصال</a>`:''}</div>`;
  d.classList.add('show');
  document.getElementById('dClose').onclick=closeDetail;

  const sb=document.getElementById('sidebar');sb.classList.remove('open');if(isMobile()) sb.classList.add('hide');

  // centre the pin in the visible part of the map (above the card)
  const z=Math.max(map.getZoom(),17);
  const size=map.getSize();
  const shift=isMobile()?size.y*0.2:0;
  const pt=map.project([loc.lat,loc.lng],z);pt.y+=shift;
  map.setView(map.unproject(pt,z),z,{animate:true});

  document.querySelectorAll('.location-card').forEach(el=>el.classList.toggle('active',+el.dataset.id===id));
  const card=document.querySelector(`.location-card[data-id="${id}"]`);
  if(card&&!isMobile()) card.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closeDetail(){
  document.getElementById('detail').classList.remove('show');
  const m=markersById[selectedId];if(m) m.setIcon(iconNormal);
  selectedId=null;
  document.getElementById('sidebar').classList.remove('hide');
  document.querySelectorAll('.location-card.active').forEach(el=>el.classList.remove('active'));
}

/* ---------- Events ---------- */
document.getElementById('listContainer').addEventListener('click',e=>{
  const c=e.target.closest('.location-card');if(c) selectLocation(+c.dataset.id);
});
document.getElementById('handle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
const searchEl=document.getElementById('searchInput');
searchEl.addEventListener('focus',()=>{if(isMobile()) document.getElementById('sidebar').classList.add('open');});
searchEl.addEventListener('input',applyFilter);

function applyFilter(){
  const q=searchEl.value.trim().toLowerCase();
  const f=!q?allLocations:allLocations.filter(l=>(l.market||'').toLowerCase().includes(q)||(l.distributor||'').toLowerCase().includes(q)||(l.phone||'').includes(q));
  renderList(f);renderMarkers(f,!!q&&f.length>0);
}

/* ---------- Data ---------- */
async function loadData(){
  try{
    const res=await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0&t=${Date.now()}`,{cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(!text.includes(',')) throw new Error('Invalid CSV');
    if(text===lastText){updateStats(allLocations);return;} // nothing changed: leave the UI alone
    lastText=text;
    allLocations=parseCSV(text);
    applyFilter();
    if(firstLoad&&allLocations.length){map.fitBounds(cluster.getBounds().pad(0.12));firstLoad=false;}
    updateStats(allLocations);
  }catch(err){
    console.error('Failed to load data:',err);
    if(!allLocations.length) document.getElementById('listContainer').innerHTML='<div class="empty-state"><p style="font-size:1.5rem">⚠️</p><p>تعذر تحميل البيانات</p><p style="font-size:.85rem;margin-top:8px">تأكد أن الشيت منشور للعامة<br>(Share → Anyone with the link)</p></div>';
    document.getElementById('lastUpdate').textContent='فشل التحديث';
  }
}

initMap();
loadData();
setInterval(loadData,REFRESH_INTERVAL);
</script>
</body>
</html>
